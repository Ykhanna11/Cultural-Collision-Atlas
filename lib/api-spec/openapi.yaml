openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: Cultural Collision Atlas API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: atlas
    description: Atlas workspace and Qloo connection
  - name: discoveries
    description: Cultural bridge discovery and saved discoveries
  - name: plans
    description: Activation plans
  - name: agent
    description: Evidence-grounded activation planning
  - name: opportunities
    description: Geographic opportunity data
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /atlas/overview:
    get:
      operationId: getAtlasOverview
      tags: [atlas]
      summary: Get public demo overview
      responses:
        "200":
          description: Workspace totals and connection state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtlasOverview"
  /qloo/status:
    get:
      operationId: getQlooStatus
      tags: [atlas]
      summary: Read Qloo configuration state
      responses:
        "200":
          description: Qloo connection state without exposing credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QlooStatus"
  /qloo/test:
    post:
      operationId: testQlooConnection
      tags: [atlas]
      summary: Verify the Qloo connection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QlooTestInput"
      responses:
        "200":
          description: Structured connection status, including unconfigured and provider-error states
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QlooStatus"
  /qloo/entities/search:
    post:
      operationId: searchQlooEntities
      tags: [atlas]
      summary: Search Qloo's entity catalog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntitySearchInput"
      responses:
        "200":
          description: Entity search results returned by Qloo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntitySearchResponse"
        "503":
          description: Qloo credentials are not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /discoveries:
    post:
      operationId: discoverCulturalBridges
      tags: [discoveries]
      summary: Request cultural bridge candidates
      description: Calls Qloo when configured. Returns an explicit setup error otherwise; never substitutes sample recommendations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscoveryInput"
      responses:
        "200":
          description: Live Qloo evidence and clearly labeled derived bridge candidates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryResponse"
        "400":
          description: Both interests must first be resolved to Qloo entities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Qloo credentials are not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /discoveries/saved:
    get:
      operationId: listSavedDiscoveries
      tags: [discoveries]
      summary: List saved discoveries
      responses:
        "200":
          description: Saved discoveries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavedDiscovery"
    post:
      operationId: saveDiscovery
      tags: [discoveries]
      summary: Save a discovery result
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveDiscoveryInput"
      responses:
        "201":
          description: Saved discovery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedDiscovery"
  /discoveries/saved/{id}:
    delete:
      operationId: deleteSavedDiscovery
      tags: [discoveries]
      summary: Delete a saved discovery
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Saved discovery deleted
        "404":
          description: Saved discovery not found
  /activation-plans:
    get:
      operationId: listActivationPlans
      tags: [plans]
      summary: List saved activation plans
      responses:
        "200":
          description: Saved plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivationPlan"
    post:
      operationId: saveActivationPlan
      tags: [plans]
      summary: Save an activation plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavePlanInput"
      responses:
        "201":
          description: Saved plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivationPlan"
  /activation-plans/agent:
    post:
      operationId: generateActivationPlanWithAgent
      tags: [agent]
      summary: Generate an evidence-grounded activation plan
      description: Uses a bounded server-side OpenAI tool loop with allowlisted Qloo tools. Requires configured OPENAI_API_KEY, OPENAI_MODEL, and Qloo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivationPlannerInput"
      responses:
        "200":
          description: Agent-generated planning hypotheses with validated Qloo evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivationPlannerResponse"
        "400":
          description: The request body did not match the activation planner input schema
        "422":
          description: Qloo evidence was insufficient to support a plan
        "429":
          description: Provider rate limit or per-run tool budget was reached
        "502":
          description: An AI provider, Qloo tool, or model-output validation failed
        "503":
          description: OpenAI model, credential, or Qloo provider is not configured
  /activation-plans/{id}:
    delete:
      operationId: deleteActivationPlan
      tags: [plans]
      summary: Delete a saved activation plan
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Plan deleted
        "404":
          description: Plan not found
  /opportunities/heatmap:
    post:
      operationId: getOpportunityHeatmap
      tags: [opportunities]
      summary: Request Qloo heatmap evidence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeatmapInput"
      responses:
        "200":
          description: Geographic affinity evidence returned by Qloo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeatmapResponse"
        "503":
          description: Qloo credentials are not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /opportunities/venues/status:
    get:
      operationId: getVenueProviderStatus
      tags: [opportunities]
      responses:
        "200":
          description: Venue provider availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenueProviderStatus"
  /opportunities/venues/search:
    post:
      operationId: searchVenues
      tags: [opportunities]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VenueSearchInput"
      responses:
        "200":
          description: Normalized Overture Places venues, or an explicitly configured OpenStreetMap fallback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenueSearchResponse"
        "502":
          description: Venue provider unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Overture data is not configured or does not cover the requested area
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /opportunities/venues/{providerVenueId}/suitability:
    post:
      operationId: assessVenueSuitability
      tags: [opportunities]
      parameters:
        - in: path
          name: providerVenueId
          required: true
          schema: { type: string, maxLength: 160 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VenueSuitabilityInput"
      responses:
        "200":
          description: Evidence-labelled venue suitability assessment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenueSuitabilityResponse"
        "404":
          description: Venue is not in the current provider cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error: { type: string }
        setupInstructions: { type: string }
      required: [error]
    QlooStatus:
      type: object
      properties:
        state:
          type: string
          enum: [not_configured, configured_unverified, verified, error]
        configured: { type: boolean }
        verified: { type: boolean }
        message: { type: string }
        checkedAt:
          type: ["string", "null"]
          format: date-time
          description: Timestamp of the most recent successful authenticated Qloo request; retained as historical context after later failures.
      required: [state, configured, verified, message]
    QlooTestInput:
      type: object
      properties:
        query: { type: string, minLength: 1, maxLength: 120 }
      required: [query]
    EntitySearchInput:
      type: object
      properties:
        query: { type: string, minLength: 1, maxLength: 120 }
        types:
          type: array
          items:
            type: string
            enum:
              - urn:entity:artist
              - urn:entity:book
              - urn:entity:brand
              - urn:entity:locality
              - urn:entity:movie
              - urn:entity:person
              - urn:entity:place
              - urn:entity:podcast
              - urn:entity:tv_show
              - urn:entity:videogame
      required: [query]
    EntityEvidence:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: ["string", "null"] }
        subtype: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        placeType: { type: ["string", "null"] }
        administrativeLevel: { type: ["integer", "null"] }
        ancestorNames:
          type: array
          items: { type: string }
        source: { type: string }
      required: [id, name, source]
    EntitySearchResponse:
      type: object
      properties:
        source: { type: string, enum: [qloo_api] }
        entities:
          type: array
          items: { $ref: "#/components/schemas/EntityEvidence" }
      required: [source, entities]
    DiscoveryInput:
      type: object
      properties:
        interestA: { type: string, minLength: 1, maxLength: 120 }
        interestB: { type: string, minLength: 1, maxLength: 120 }
        interestAId: { type: string, minLength: 1, maxLength: 160 }
        interestBId: { type: string, minLength: 1, maxLength: 160 }
        city: { type: string, minLength: 1, maxLength: 120 }
        cityEntityId: { type: string, format: uuid }
        recommendationType:
          type: string
          enum: [urn:entity:brand, urn:entity:place, urn:entity:destination]
        activationType:
          type: string
          enum: [pop-up, live_event, brand_collaboration, retail_experience, community_event]
        budgetRange: { type: string, minLength: 1, maxLength: 80 }
        objective: { type: string, minLength: 1, maxLength: 300 }
        audienceDescription: { type: string, maxLength: 500 }
      required: [interestA, interestB, city, activationType, budgetRange, objective, interestAId, interestBId]
    ActivationPlannerInput:
      type: object
      properties:
        input:
          $ref: "#/components/schemas/DiscoveryInput"
        bridgeId: { type: string, minLength: 1, maxLength: 160 }
        bridgeName: { type: string, minLength: 1, maxLength: 160 }
      required: [input, bridgeId, bridgeName]
    AgentEvidence:
      type: object
      properties:
        referenceId: { type: string }
        source: { type: string, enum: [qloo_api] }
        kind: { type: string, enum: [entity_search, insights] }
        entityId: { type: string }
        name: { type: string }
        details:
          type: object
          additionalProperties:
            type: ["string", "number", "null"]
      required: [referenceId, source, kind, entityId, name, details]
    ActivationPlannerResponse:
      type: object
      properties:
        source: { type: string, enum: [ai_generated, deterministic_fallback] }
        fallbackReason:
          type: string
          enum: [credentials_unavailable, insufficient_evidence, invalid_structured_output, model_or_provider_failure]
        caveat: { type: string }
        strategy:
          $ref: "#/components/schemas/ActivationStrategy"
        userProvidedAssumptions:
          type: array
          items: { type: string }
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/AgentEvidence"
      required: [source, caveat, strategy, userProvidedAssumptions, evidence]
    ActivationStrategy:
      type: object
      properties:
        executiveSummary: { type: string, minLength: 1, maxLength: 700 }
        opportunity: { type: string, minLength: 1, maxLength: 700 }
        targetAudience:
          type: object
          properties:
            hypothesis: { type: string, minLength: 1, maxLength: 700 }
            rationale:
              type: array
              maxItems: 8
              items:
                type: object
                properties:
                  claim: { type: string, minLength: 1, maxLength: 700 }
                  evidenceReferences:
                    type: array
                    minItems: 1
                    maxItems: 20
                    items: { type: string, minLength: 1, maxLength: 32 }
                required: [claim, evidenceReferences]
                additionalProperties: false
          required: [hypothesis, rationale]
          additionalProperties: false
        culturalInsights:
          type: array
          maxItems: 8
          items:
            type: object
            properties:
              insight: { type: string, minLength: 1, maxLength: 700 }
              evidenceReferences:
                type: array
                minItems: 1
                maxItems: 20
                items: { type: string, minLength: 1, maxLength: 32 }
            required: [insight, evidenceReferences]
            additionalProperties: false
        campaignConcept:
          type: object
          properties:
            name: { type: string, minLength: 1, maxLength: 700 }
            narrative: { type: string, minLength: 1, maxLength: 700 }
            creativeDirection: { type: string, minLength: 1, maxLength: 700 }
          required: [name, narrative, creativeDirection]
          additionalProperties: false
        activationChannels:
          type: array
          minItems: 1
          maxItems: 8
          items: { type: string, minLength: 1, maxLength: 700 }
        partnershipCategories:
          type: array
          minItems: 1
          maxItems: 8
          items: { type: string, minLength: 1, maxLength: 700 }
        executionTimeline:
          type: array
          minItems: 2
          maxItems: 8
          items:
            type: object
            properties:
              phase: { type: string, minLength: 1, maxLength: 700 }
              tasks:
                type: array
                minItems: 1
                maxItems: 6
                items: { type: string, minLength: 1, maxLength: 700 }
              deliverables:
                type: array
                minItems: 1
                maxItems: 6
                items: { type: string, minLength: 1, maxLength: 700 }
            required: [phase, tasks, deliverables]
            additionalProperties: false
        successMetrics:
          type: array
          minItems: 1
          maxItems: 8
          items:
            type: object
            properties:
              metric: { type: string, minLength: 1, maxLength: 700 }
              rationale: { type: string, minLength: 1, maxLength: 700 }
              measurementMethod: { type: string, minLength: 1, maxLength: 700 }
            required: [metric, rationale, measurementMethod]
            additionalProperties: false
        risksAndAssumptions:
          type: array
          minItems: 1
          maxItems: 8
          items:
            type: object
            properties:
              category:
                type: string
                enum: [risk, model_assumption]
              statement: { type: string, minLength: 1, maxLength: 700 }
              mitigation: { type: string, minLength: 1, maxLength: 700 }
            required: [category, statement, mitigation]
            additionalProperties: false
        validationExperiments:
          type: array
          minItems: 1
          maxItems: 6
          items:
            type: object
            properties:
              experiment: { type: string, minLength: 1, maxLength: 700 }
              method: { type: string, minLength: 1, maxLength: 700 }
              decisionSignal: { type: string, minLength: 1, maxLength: 700 }
            required: [experiment, method, decisionSignal]
            additionalProperties: false
      required:
        - executiveSummary
        - opportunity
        - targetAudience
        - culturalInsights
        - campaignConcept
        - activationChannels
        - partnershipCategories
        - executionTimeline
        - successMetrics
        - risksAndAssumptions
        - validationExperiments
      additionalProperties: false
    EvidenceItem:
      type: object
      properties:
        source: { type: string }
        label: { type: string }
        value: { type: string }
        kind:
          type: string
          enum: [observed_api, external_data, derived, hypothesis]
      required: [source, label, value, kind]
    BridgeCandidate:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        explanation: { type: string }
        score: { type: number, minimum: 0, maximum: 100 }
        scoreDescription: { type: string }
        confidence: { type: string, enum: [low, medium, high] }
        localityCityEntityId: { type: ["string", "null"] }
        localityStatus:
          type: string
          enum: [matches_selected_city, outside_selected_city, unavailable]
        evidence:
          type: array
          items: { $ref: "#/components/schemas/EvidenceItem" }
      required: [id, name, explanation, score, scoreDescription, confidence, evidence]
    DiscoveryResponse:
      type: object
      properties:
        source: { type: string, enum: [qloo_api] }
        candidates:
          type: array
          items: { $ref: "#/components/schemas/BridgeCandidate" }
        caveat: { type: string }
        generatedAt: { type: string, format: date-time }
      required: [source, candidates, caveat, generatedAt]
    SaveDiscoveryInput:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        city: { type: string, minLength: 1, maxLength: 120 }
        interestA: { type: string, minLength: 1, maxLength: 120 }
        interestB: { type: string, minLength: 1, maxLength: 120 }
        result: { type: object, additionalProperties: true }
      required: [title, city, interestA, interestB, result]
    SavedDiscovery:
      allOf:
        - $ref: "#/components/schemas/SaveDiscoveryInput"
        - type: object
          properties:
            id: { type: integer }
            createdAt: { type: string, format: date-time }
          required: [id, createdAt]
    PlanSection:
      type: object
      properties:
        title: { type: string }
        content: { type: string }
      required: [title, content]
    SavePlanInput:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        city: { type: string, minLength: 1, maxLength: 120 }
        interestA: { type: string, minLength: 1, maxLength: 120 }
        interestB: { type: string, minLength: 1, maxLength: 120 }
        bridgeName: { type: string, minLength: 1, maxLength: 160 }
        objective: { type: string, minLength: 1, maxLength: 300 }
        plan: { type: object, additionalProperties: true }
      required: [title, city, interestA, interestB, bridgeName, objective, plan]
    ActivationPlan:
      allOf:
        - $ref: "#/components/schemas/SavePlanInput"
        - type: object
          properties:
            id: { type: integer }
            createdAt: { type: string, format: date-time }
          required: [id, createdAt]
    HeatmapInput:
      type: object
      properties:
        city: { type: string, minLength: 1, maxLength: 120 }
        entityId: { type: string, minLength: 1, maxLength: 160 }
      required: [city, entityId]
    HeatmapPoint:
      type: object
      properties:
        latitude: { type: number }
        longitude: { type: number }
        affinity: { type: number }
        affinityRank: { type: number }
        popularity: { type: number }
      required: [latitude, longitude]
    HeatmapResponse:
      type: object
      properties:
        source: { type: string, enum: [qloo_api] }
        points:
          type: array
          items: { $ref: "#/components/schemas/HeatmapPoint" }
      required: [source, points]
    AtlasOverview:
      type: object
      properties:
        savedDiscoveries: { type: integer }
        savedPlans: { type: integer }
        qloo:
          $ref: "#/components/schemas/QlooStatus"
        venueProviderConfigured: { type: boolean }
      required: [savedDiscoveries, savedPlans, qloo, venueProviderConfigured]
    VenueBoundingBox:
      type: object
      properties:
        south: { type: number, minimum: -90, maximum: 90 }
        west: { type: number, minimum: -180, maximum: 180 }
        north: { type: number, minimum: -90, maximum: 90 }
        east: { type: number, minimum: -180, maximum: 180 }
      required: [south, west, north, east]
    Venue:
      type: object
      properties:
        provider: { type: string, enum: [openstreetmap, overture] }
        providerVenueId: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        address: { type: string }
        categories: { type: array, items: { type: string } }
        website: { type: string }
        phone: { type: string }
        email: { type: string }
        rating: { type: number }
        ratingCount: { type: integer }
        openingHours: { type: string }
        sourceMetadata:
          $ref: "#/components/schemas/VenueSourceMetadata"
        attribution: { type: string }
        retrievedAt: { type: string, format: date-time }
      required: [provider, providerVenueId, name, latitude, longitude, categories, attribution, retrievedAt]
    VenueSourceMetadata:
      type: object
      properties:
        basicCategory: { type: string }
        taxonomy:
          type: array
          items: { type: string }
        operatingStatus: { type: string }
        sources:
          type: array
          items:
            type: object
            properties:
              dataset: { type: string }
              license: { type: string }
              provider: { type: string }
              recordId: { type: string }
              version: { type: string }
    VenueProviderStatus:
      type: object
      properties:
        configured: { type: boolean }
        state: { type: string, enum: [reachable, unavailable, unknown] }
        message: { type: string }
      required: [configured, state, message]
    VenueSearchInput:
      type: object
      properties:
        bbox: { $ref: "#/components/schemas/VenueBoundingBox" }
        radius:
          type: object
          properties:
            latitude: { type: number, minimum: -90, maximum: 90 }
            longitude: { type: number, minimum: -180, maximum: 180 }
            kilometers: { type: number, minimum: 0.1, maximum: 25 }
          required: [latitude, longitude, kilometers]
        categories:
          type: array
          items:
            type: string
            enum: [restaurant, cafe, shopping, entertainment, sports, culture, museum, event_space]
        query: { type: string, maxLength: 120 }
        limit: { type: integer, minimum: 1, maximum: 50, default: 25 }
      required: [categories]
    VenueSearchResponse:
      type: object
      properties:
        source: { type: string, enum: [openstreetmap, overture] }
        venues:
          type: array
          items: { $ref: "#/components/schemas/Venue" }
        attribution: { type: string }
      required: [source, venues, attribution]
    VenueSuitabilityEvidence:
      type: object
      properties:
        kind: { type: string, enum: [venue_fact, category_match, geographic_context, bridge_evidence, qloo_evidence, missing_data] }
        label: { type: string }
        value: { type: string }
      required: [kind, label, value]
    VenueSuitabilityInput:
      type: object
      properties:
        interestA: { type: string, minLength: 1, maxLength: 120 }
        interestB: { type: string, minLength: 1, maxLength: 120 }
        bridgeName: { type: string, maxLength: 160 }
        categories:
          type: array
          items: { type: string, maxLength: 80 }
          maxItems: 20
        qlooEvidence:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceItem"
      required: [interestA, interestB]
    VenueSuitabilityResponse:
      type: object
      properties:
        score: { type: integer, minimum: 0, maximum: 100 }
        scoreLabel: { type: string }
        explanation: { type: string }
        evidence:
          type: array
          items: { $ref: "#/components/schemas/VenueSuitabilityEvidence" }
        missingData: { type: array, items: { type: string } }
      required: [score, scoreLabel, explanation, evidence, missingData]
